name: jingfa-accounts
services:
  auth:
    image: node:22-alpine
    container_name: jingfa-auth
    working_dir: /app
    command: ["node", "auth-server.mjs"]
    env_file: ["./auth.env"]
    volumes: ["./:/app:ro"]
    networks: [gateway, database]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
networks:
  gateway:
    external: true
    name: baige-dashboard_internal
  database:
    external: true
    name: jingfa_internal
